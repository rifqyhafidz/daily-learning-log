
name: Daily Learning Log

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create scheduled log
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          DATE=$(TZ=Asia/Jakarta date +%Y-%m-%d)

          case "$SCHEDULE" in
            "0 1 * * *") SLOT="08-00" ;;
            "0 6 * * *") SLOT="13-00" ;;
            "0 13 * * *") SLOT="20-00" ;;
            *) SLOT=$(TZ=Asia/Jakarta date +%H-%M-%S) ;;
          esac

          mkdir -p learning-log
          FILE="learning-log/${DATE}-${SLOT}.md"

          if [ ! -f "$FILE" ]; then
            cat > "$FILE" <<EOF
          # Learning Log - ${DATE} ${SLOT} WIB

          ## Materi yang dipelajari
          Catat materi yang benar-benar dipelajari.

          ## Praktik
          Catat latihan yang benar-benar dikerjakan.

          ## Evaluasi
          Catat hasil belajar dan kendala.
          EOF
          fi

      - name: Commit and push
        run: |
          git config user.name "rifqyhafidz"
          git config user.email "rifqyhafidz28@gmail.com"

          git add learning-log/

          if ! git diff --cached --quiet; then
            git commit -m "Update learning log"
            git push origin main
          fi
